services:
  db:
    image: mysql:latest
    container_name: db-webacademy
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: senharoot
      MYSQL_DATABASE: livraria
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senhasegura
    networks:
      - net-web-remote
    volumes:
      - db_data:/var/lib/mysql
      - ./bd:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin-webacademy
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: usuario
      PMA_PASSWORD: senhasegura
    networks:
      - net-web-remote
    depends_on:
      - db

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-webacademy
    restart: always
    ports:
      - "4444:4444"
    env_file:
      - ./backend/.env
    networks:
      - net-web-remote
    depends_on:
      - db

  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-webacademy
    restart: always
    ports:
      - "8000:80"
    networks:
      - net-web-remote
    depends_on:
      - back

networks:
  net-web-remote:
    driver: bridge

volumes:
  db_data:

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turma de Educação Física</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">Turma de Educação Física</span>
    </div>
  </nav>

  <main class="container">

    <!-- Estatísticas -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card text-center border-primary">
          <div class="card-body py-2">
            <div class="text-muted small">Nº de Alunos</div>
            <div class="fs-3 fw-bold text-primary">{{NUM_ALUNOS}}</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center border-secondary">
          <div class="card-body py-2">
            <div class="text-muted small">Média de Idade</div>
            <div class="fs-5 fw-bold text-secondary">{{MEDIA_IDADES}}</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center border-secondary">
          <div class="card-body py-2">
            <div class="text-muted small">Média de Altura</div>
            <div class="fs-5 fw-bold text-secondary">{{MEDIA_ALTURAS}}</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card text-center border-secondary">
          <div class="card-body py-2">
            <div class="text-muted small">Média de Peso</div>
            <div class="fs-5 fw-bold text-secondary">{{MEDIA_PESOS}}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Botão inserir -->
    <div class="d-flex justify-content-end mb-3">
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalInserir">
        Inserir Aluno
      </button>
    </div>

    <!-- Tabela de alunos -->
    <div class="table-responsive rounded border">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Altura</th>
            <th>Peso</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          {{ROWS}}
        </tbody>
      </table>
    </div>

  </main>

  <!-- Modal: Inserir Aluno -->
  <div class="modal fade" id="modalInserir" tabindex="-1" aria-labelledby="modalInserirLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalInserirLabel">Inserir Aluno</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <form method="post" action="/aluno">
          <div class="modal-body">
            <div class="mb-3">
              <label for="nomeCompleto" class="form-label">Nome Completo</label>
              <input type="text" id="nomeCompleto" name="nomeCompleto" class="form-control" maxlength="60" required>
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label for="idade" class="form-label">Idade (anos)</label>
                <input type="number" id="idade" name="idade" class="form-control" min="1" max="120" required>
              </div>
              <div class="col-4">
                <label for="altura" class="form-label">Altura (m)</label>
                <input type="number" id="altura" name="altura" class="form-control" step="0.01" min="0.50" max="2.50"
                  required>
              </div>
              <div class="col-4">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input type="number" id="peso" name="peso" class="form-control" step="0.1" min="1" max="300" required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- Modal: Editar Aluno -->
  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalEditarLabel">Editar Aluno</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <form id="formEditar" method="post" action="">
          <div class="modal-body">
            <div class="mb-3">
              <label for="nomeCompletoEditar" class="form-label">Nome Completo</label>
              <input type="text" id="nomeCompletoEditar" name="nomeCompleto" class="form-control" maxlength="60"
                required>
            </div>
            <div class="row g-2">
              <div class="col-4">
                <label for="idadeEditar" class="form-label">Idade (anos)</label>
                <input type="number" id="idadeEditar" name="idade" class="form-control" min="1" max="120" required>
              </div>
              <div class="col-4">
                <label for="alturaEditar" class="form-label">Altura (m)</label>
                <input type="number" id="alturaEditar" name="altura" class="form-control" step="0.01" min="0.50"
                  max="2.50" required>
              </div>
              <div class="col-4">
                <label for="pesoEditar" class="form-label">Peso (kg)</label>
                <input type="number" id="pesoEditar" name="peso" class="form-control" step="0.1" min="1" max="300"
                  required>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script>
    document.getElementById('modalEditar').addEventListener('show.bs.modal', function (event) {
      const btn = event.relatedTarget;
      document.getElementById('formEditar').action = '/aluno/' + btn.getAttribute('data-id') + '/edit';
      document.getElementById('nomeCompletoEditar').value = btn.getAttribute('data-nome');
      document.getElementById('idadeEditar').value = btn.getAttribute('data-idade');
      document.getElementById('alturaEditar').value = btn.getAttribute('data-altura');
      document.getElementById('pesoEditar').value = btn.getAttribute('data-peso');
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

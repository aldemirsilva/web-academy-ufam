<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Atualizar Cliente</title>
</head>

<body>
  <h1>Atualizar Cliente</h1>

  <form id="form-update">
    <p>
      <label>CPF:<br />
        <input id="cpf" type="text" placeholder="123.456.789-00" required />
      </label>
    </p>
    <p>
      <label>Nome completo:<br />
        <input id="nome_completo" type="text" placeholder="Alice Silva" required />
      </label>
    </p>
    <p>
      <label>Celular:<br />
        <input id="celular" type="text" placeholder="(11) 99999-9999" required />
      </label>
    </p>
    <p>
      <label>E-mail:<br />
        <input id="e_mail" type="email" placeholder="alice@email.com" required />
      </label>
    </p>
    <p>
      <label>Data de nascimento:<br />
        <input id="data_nascimento" type="date" required />
      </label>
    </p>

    <button type="submit">Atualizar</button>
  </form>

  <pre id="resultado"></pre>

  <script type="module" src="js/update.js"></script>
</body>

</html>
